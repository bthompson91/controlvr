<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Control Room</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#171b28;color:white;font:14px system-ui}canvas{display:block;touch-action:none}header{position:fixed;top:12px;left:12px;padding:12px;border-radius:12px;background:#111827cc;pointer-events:none;line-height:1.5}small{opacity:.75}nav{position:fixed;bottom:16px;left:8px;right:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}button{padding:12px;border:1px solid #718096;border-radius:10px;background:#202b40;color:white}button:active{background:#526488}#status{position:fixed;top:130px;left:15px;right:15px;text-align:center;pointer-events:none}#panel{position:fixed;bottom:90px;left:12px;right:12px;max-width:420px;margin:auto;padding:16px;background:#111827ed;border:1px solid #718096;border-radius:14px}input{width:100%}h2{font-size:18px;margin-top:0}
</style></head><body><header><b>Pocket Control Room</b><br>Drag to orbit · pinch to zoom · tap equipment<br><small>Approximate 3D model · simulated controls</small></header><div id="status">Loading engine… Internet required.</div><section id="panel" hidden></section><nav><button data-view="0">Room</button><button data-view="1">Desk</button><button data-view="2">Console</button><button id="party">Party lights</button><button id="sound">Sound off</button></nav><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>
'use strict';
if(!window.THREE||!THREE.OrbitControls){document.getElementById('status').textContent='Engine failed to load. Open in a browser with internet access.';}else{boot();}
function boot(){
const scene=new THREE.Scene();scene.background=new THREE.Color(0x222532);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.03,40);camera.position.set(3.9,3.4,5.1);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.set(0,1.1,-.25);controls.enableDamping=true;controls.minDistance=.65;controls.maxDistance=9;controls.maxPolarAngle=Math.PI*.49;scene.add(new THREE.HemisphereLight(0xffffff,0x6a3144,1));const light=new THREE.PointLight(0xffefda,.9,14);light.position.set(0,2.8,1);scene.add(light);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});const white=material(0xe9e8e3),black=material(0x22252a),silver=material(0x89929a),hits=[];
function box(w,h,d,x,y,z,m=white,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o;}
function tap(o,fn){o.userData.action=fn;hits.push(o);return o;}
function message(s){document.getElementById('status').textContent=s;clearTimeout(message.timer);message.timer=setTimeout(()=>document.getElementById('status').textContent='',2500);}
const panel=document.getElementById('panel');function show(title,html){panel.hidden=false;panel.innerHTML='<button id="close" style="float:right">×</button><h2>'+title+'</h2>'+html;document.getElementById('close').onclick=()=>panel.hidden=true;}
box(4.5,.1,3.7,0,-.07,0,material(0x9c1530));box(4.5,2.9,.08,0,1.4,-1.88);box(.08,2.9,3.7,-2.28,1.4,0);box(2.7,.09,.76,-.55,.78,-1.23);box(.7,.09,1.8,-1.9,.78,-.15);
for(const x of [-1.83,.72])for(const z of [-1.52,-.93])box(.045,.77,.045,x,.37,z);for(const x of [-1.19,.1]){box(1.22,.14,.69,x,.66,-1.23);box(.29,.025,.025,x,.68,-.868,black);}
box(.55,.72,.68,1.08,.36,-1.24);for(const y of [.22,.55]){box(.51,.29,.035,1.08,y,-.88);box(.16,.025,.025,1.08,y+.04,-.85,silver);}
for(const x of [-1.05,.12]){box(.55,.1,.54,x,.46,-.15);box(.56,.65,.09,x,.8,.12);for(const a of [-.22,.22])for(const b of [-.2,.2])box(.025,.43,.025,x+a,.22,-.15+b,silver);}
box(.74,1.22,.82,1.78,.61,-1.17,black);for(let row=0;row<5;row++){const y=.32+row*.17;box(.63,.11,.025,1.78,y,-.74,silver);for(let j=0;j<10;j++){box(.035,.03,.015,1.5+j*.06,y,-.72,black);box(.012,.012,.014,1.51+j*.06,y+.03,-.71,material(j%3?0x32b87d:0xfbc94a));}}
for(let i=0;i<16;i++){const x=1.49+i*.035;const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(x,.8,-.7),new THREE.Vector3(x+.04,.4,-.48),new THREE.Vector3(1.7+Math.sin(i)*.16,.15,-.5),new THREE.Vector3(1.55+(i%8)*.055,.47,-.7)]);scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,16,.006,4,false),material(i%4?0x3876ac:0xb1bbc1)));}
let mode=0,party=false;const displays=[];function screen(w,h,x,y,z,index){box(w+.045,h+.045,.055,x,y,z,black);const c=document.createElement('canvas');c.width=512;c.height=256;const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex}));mesh.position.set(x,y,z+.03);scene.add(mesh);displays.push({c,tex,index});tap(mesh,()=>{mode=(mode+1)%3;message(['Multiview','Audio meters','Standby'][mode]);});}
screen(1.04,.59,-1.03,2.12,-1.71,0);screen(1.04,.59,.065,2.12,-1.71,1);screen(1.29,.54,-.49,1.48,-1.64,2);
function draw(t){for(const {c,tex,index} of displays){const ctx=c.getContext('2d');ctx.fillStyle='#07111e';ctx.fillRect(0,0,512,256);if(mode===0){for(let k=0;k<4;k++){const x=k%2*256,y=Math.floor(k/2)*128;ctx.fillStyle=['#243d56','#382c54','#20454a','#493138'][(k+index)%4];ctx.fillRect(x+3,y+3,250,122);ctx.fillStyle='#dceef7';ctx.font='16px monospace';ctx.fillText(['CAM 1','CAM 2','SLIDES','PROGRAM'][k],x+12,y+25);for(let j=0;j<6;j++){ctx.fillStyle=k===3?'#e86875':'#4b8597';ctx.fillRect(x+14+j*37,y+58+Math.sin(t+j+k)*12,25,32);}}}else if(mode===1){for(let j=0;j<18;j++){const h=25+(Math.sin(t*2+j*.8)*.5+.5)*160;ctx.fillStyle=h>160?'#edcb50':'#40d5a0';ctx.fillRect(14+j*27,220-h,17,h);}}else{ctx.fillStyle='#8bd9dc';ctx.font='bold 35px sans-serif';ctx.fillText('CONTROL ROOM',92,110);ctx.font='20px monospace';ctx.fillText('STANDBY / READY',135,150);}ctx.fillStyle='#fff';ctx.font='13px monospace';ctx.fillText('SIMULATED '+new Date().toLocaleTimeString(),10,248);tex.needsUpdate=true;}}
box(.31,.47,.27,-1.85,1.5,-1.51,silver);for(const [y,r] of [[1.43,.1],[1.64,.045]]){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.02,24),black);o.rotation.x=Math.PI/2;o.position.set(-1.85,y,-1.36);scene.add(o);}
let audio,gain,sound=false;const faders=[];let master=.6;function openMixer(){show('Simulated mixer','<label>Master<input id="master" type="range" min="0" max="100" value="'+Math.round(master*100)+'"></label><p>Tap a fader to step its level. Master adjusts the optional synthesised tone.</p>');document.getElementById('master').oninput=e=>{master=+e.target.value/100;if(gain&&sound)gain.gain.value=master*.035;};}
function mixer(w,d,x,y,z,n){const g=new THREE.Group();g.position.set(x,y,z);g.rotation.x=.23;scene.add(g);tap(box(w,.07,d,0,0,0,black,g),openMixer);for(let i=0;i<n;i++){const xx=-w*.43+i*w*.86/(n-1);box(.012,.008,d*.6,xx,.041,.04,silver,g);const f=box(w/n*.55,.024,.045,xx,.055,.06,silver,g);const state={o:f,level:.6,span:d*.25};faders.push(state);tap(f,()=>{state.level=(state.level+.25)%1.01;message('Channel '+(i+1)+': '+Math.round(state.level*100)+'%');openMixer();});for(let j=0;j<3;j++)box(.025,.02,.025,xx,.058,-d*.31+j*.05,material(j?0x677583:0x83bba7),g);}}
mixer(.75,.4,-.49,.94,-1.31,9);mixer(.78,.63,1.78,1.3,-1.16,16);box(.73,.025,.22,-.49,.845,-.98,black);for(let r=0;r<4;r++)for(let c=0;c<16;c++)box(.031,.009,.031,-.82+c*.043,.862,-1.06+r*.048,material(0x444951));
for(const x of [-1.04,.3]){box(.18,.04,.14,x,.85,-1.14);for(let i=0;i<15;i++){const o=box(.023,.014,.026,x-.062+i%5*.031,.88,-1.18+Math.floor(i/5)*.035,material([0x3da9af,0xbf5682,0x78ba77][i%3]));tap(o,()=>{mode=i%3;if(i===14)party=!party;message('Cue '+(i+1)+' triggered');});}}
tap(box(.38,.025,.26,-1.5,.85,-1.16,black),()=>{show('Tablet','<button id="screens">Change screens</button> <button id="lights">Party lights</button><p>All interactions are simulated. No live equipment connections.</p>');document.getElementById('screens').onclick=()=>mode=(mode+1)%3;document.getElementById('lights').onclick=()=>party=!party;});
const hinge=new THREE.Group();hinge.position.set(2.18,0,.55);scene.add(hinge);let doorOpen=false;const door=box(.06,2.3,.86,0,1.15,.43,material(0x79441e),hinge);for(const y of [.56,1.67])box(.025,.86,.68,-.042,y,.43,material(0x8e5228),hinge);box(.05,.04,.17,-.08,1.05,.7,silver,hinge);tap(door,()=>{doorOpen=!doorOpen;message(doorOpen?'Door open':'Door closed');});
const clock=new THREE.Mesh(new THREE.CircleGeometry(.17,32),silver);clock.position.set(1.29,2.25,-1.82);scene.add(clock);for(const a of [0,Math.PI*.7]){const hand=box(.012,.13,.008,1.29,2.29,-1.8,black);hand.rotation.z=a;}
document.getElementById('party').onclick=()=>party=!party;document.getElementById('sound').onclick=()=>{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.gain.value=0;const osc=audio.createOscillator();osc.frequency.value=110;osc.connect(gain);gain.connect(audio.destination);osc.start();}audio.resume();sound=!sound;gain.gain.setTargetAtTime(sound?master*.035:0,audio.currentTime,.1);document.getElementById('sound').textContent=sound?'Sound on':'Sound off';};
const views=[[3.9,3.4,5.1,0,1.1,-.25],[-.5,1.6,.7,-.5,1.25,-1.4],[2.6,2.1,.5,1.7,1,-1.15]];let dest=null;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>dest=views[+b.dataset.view]);
let pointer=null;renderer.domElement.addEventListener('pointerdown',e=>pointer={x:e.clientX,y:e.clientY,t:performance.now()});renderer.domElement.addEventListener('pointerup',e=>{if(!pointer||Math.hypot(pointer.x-e.clientX,pointer.y-e.clientY)>9||performance.now()-pointer.t>600)return;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),camera);const found=ray.intersectObjects(hits,false);if(found.length)found[0].object.userData.action();});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});document.getElementById('status').textContent='';let last=0;function animate(ms){requestAnimationFrame(animate);const t=ms/1000;if(ms-last>95){draw(t);last=ms;}if(dest){const p=new THREE.Vector3(...dest.slice(0,3));camera.position.lerp(p,.09);controls.target.lerp(new THREE.Vector3(...dest.slice(3)),.09);if(camera.position.distanceTo(p)<.01)dest=null;}hinge.rotation.y+=((doorOpen?-1.35:0)-hinge.rotation.y)*.08;for(const f of faders)f.o.position.z=.06+(f.level-.5)*f.span;if(party){light.color.setHSL(t*.12%1,.75,.65);light.intensity=1.5;}else{light.color.setHex(0xffefda);light.intensity=.9;}controls.update();renderer.render(scene,camera);}requestAnimationFrame(animate);
}
</script></body></html>
